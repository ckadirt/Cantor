name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The site serves these files itself (docs/public links to them), so a
      # change to any of them is a change to cantorfm.com.
      - 'node/install.sh'
      - 'relay/public/catalog/**'
      - 'relay/public/backends/**'
      # The site draws with the app's geometry, fonts and icon.
      - 'cantor/src/lenses/**'
      - 'cantor/src/marks/**'
      - 'cantor/src/motion/**'
      - 'cantor/src/field/**'
      - 'cantor/assets/fonts/**'
      - 'cantor/android/app/src/main/res/drawable/ic_launcher_foreground.xml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# A queued deploy waits rather than being dropped: the later commit is the one
# that must end up live.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            cantor/package-lock.json

      # The site imports the app's geometry and reads the BIP39 wordlist from
      # the app's dependencies.
      - working-directory: cantor
        run: npm ci --ignore-scripts
      - working-directory: docs
        run: npm ci

      - working-directory: docs
        run: npm run build

      - name: deploy
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # What a node and the installer actually fetch must be the files in this
      # commit. A fresh deploy takes a moment to reach every edge.
      - name: the published files match this commit
        run: |
          set -eu
          check() {
            for attempt in 1 2 3 4 5 6; do
              curl -fsSL "https://cantorfm.com/$1" -o published || true
              if [ -s published ] && diff -q "$2" published >/dev/null; then
                echo "/$1 matches $2 (attempt $attempt)"
                return 0
              fi
              echo "/$1 not live yet; retrying in 10s (attempt $attempt)"
              sleep 10
            done
            echo "cantorfm.com/$1 never matched $2" >&2
            return 1
          }
          check install.sh node/install.sh
          check catalog/v1.json relay/public/catalog/v1.json
          check backends/v1.json relay/public/backends/v1.json
          check app/latest.json docs/dist/app/latest.json

      # Every installed app reads this to offer an update: its APK must exist,
      # at the size it claims.
      - name: the app manifest points at a real APK
        run: |
          set -eu
          url=$(node -p "require('./docs/dist/app/latest.json').url")
          bytes=$(node -p "require('./docs/dist/app/latest.json').bytes")
          got=$(curl -fsSL --head "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:" {n=$2} END {print n}')
          if [ "$got" != "$bytes" ]; then
            echo "latest.json says $bytes bytes; $url answers $got" >&2
            exit 1
          fi
          echo "the APK at $url is $got bytes, as the manifest says"
