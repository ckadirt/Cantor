name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The four implementations agree because one manifest generates their
  # constants and one fixture corpus pins their bytes. This job is what stops a
  # transport change from reaching only three of them.
  transport:
    name: transport contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: generated transport constants are current
        run: node protocol/transport/generate.mjs --check
      - name: the manifest and generator hold
        run: node --test protocol/transport/generate.test.mjs
      - name: the integration client agrees with the shared fixtures
        run: node --test node/scripts/lib/transport.test.mjs
      - name: the relay smoke client parses
        run: node --check relay/scripts/smoke.mjs

  node:
    name: node (rust, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: fmt
        working-directory: node
        run: cargo fmt --check
      - name: clippy
        working-directory: node
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `cargo test` also regenerates protocol/*.ts through ts-rs, so a type
      # change that was never committed shows up as a dirty tree below.
      - name: test
        working-directory: node
        run: cargo test --workspace
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: build CLI for lifecycle tests
        working-directory: node
        run: cargo build -p cantor
      - name: installer and detached lifecycle
        run: node --test node/scripts/install.test.mjs node/scripts/lifecycle.test.mjs
      - name: protocol bindings are committed
        run: git diff --exit-code -- protocol

  relay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - working-directory: relay
        run: npm ci
      - working-directory: relay
        run: npx vitest run
      - working-directory: relay
        run: npm run check

  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cantor/package-lock.json
      - working-directory: cantor
        run: npm ci
      - working-directory: cantor
        run: npx tsc --noEmit
      - working-directory: cantor
        run: npx eslint .
      - working-directory: cantor
        run: npx jest
      - name: Android JVM tests and debug build
        working-directory: cantor/android
        run: >-
          ./gradlew app:testDebugUnitTest app:assembleDebug
          -PreactNativeArchitectures=arm64-v8a --no-daemon
