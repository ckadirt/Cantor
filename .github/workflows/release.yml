name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on the oldest runner still supported, because a binary
          # links the glibc it was built against and only runs on that version
          # or newer. Building on 24.04 would exclude every 22.04 host.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A tag that disagrees with the manifest would ship a binary whose
      # `cantor --version` contradicts the release it came from, and `cantor
      # upgrade` compares exactly those two things.
      - name: tag matches the crate version
        working-directory: node
        run: |
          set -eu
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cantor"))')
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $crate" >&2
            exit 1
          fi

      # A released binary whose transport constants disagree with the manifest
      # cannot talk to the app or relay built from the same commit.
      - name: generated transport constants are current
        run: node protocol/transport/generate.mjs --check

      - name: build
        working-directory: node
        run: cargo build --release -p cantor

      # The installer downloads exactly these names and the .sha256 beside each,
      # reading the first field of the first line. Do not rename them without
      # changing node/install.sh in the same commit.
      - name: package
        working-directory: node
        run: |
          set -eu
          asset="cantor-${{ matrix.target }}"
          cp target/release/cantor "$asset"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -l "$asset" "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            node/cantor-${{ matrix.target }}
            node/cantor-${{ matrix.target }}.sha256
          if-no-files-found: error

  macos-engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            backend: metal
            metal: 'ON'
          - runner: macos-14
            arch: aarch64
            backend: cpu
            metal: 'OFF'
          - runner: macos-15-intel
            arch: x86_64
            backend: cpu
            metal: 'OFF'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ckadirt/acestep.cpp
          ref: 79994ed1780d676f2676168159d861fddc647ae0
          submodules: recursive
          path: engine-source
      - name: build native engine
        run: |
          cmake -S engine-source -B engine-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF \
            -DGGML_METAL=${{ matrix.metal }} -DGGML_METAL_EMBED_LIBRARY=${{ matrix.metal }} \
            -DGGML_OPENMP=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build engine-build --target cantor-engine ggml-cpu --parallel 3
          if [ "${{ matrix.metal }}" = ON ]; then
            cmake --build engine-build --target ggml-metal --parallel 3
          fi
      - name: package and load-test relocated engine
        run: |
          python3 node/scripts/package-macos-engine.py engine-build engine-assets \
            '${{ matrix.arch }}' '${{ matrix.backend }}' \
            'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: engine-macos-${{ matrix.arch }}-${{ matrix.backend }}
          path: engine-assets/*
          if-no-files-found: error

  release:
    needs: [build, macos-engines]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: checksums are self-consistent
        working-directory: assets
        run: |
          set -eu
          ls -l
          for sum in *.sha256; do sha256sum --check "$sum"; done

      - name: assemble macOS backend manifest
        working-directory: assets
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          paths = sorted(Path('.').glob('acestep-engine-*.tar.gz.json'))
          assert len(paths) == 3, paths
          artifacts = [json.loads(p.read_text()) for p in paths]
          Path('backends-macos-v1.json').write_text(json.dumps({
              'schema': 1, 'engines': [{'name': 'acestep', 'abi': 1, 'backends': artifacts}]
          }, indent=2) + '\n')
          for path in paths:
              path.unlink()
          PYTHON

      # The GitHub CLI is preinstalled on the runner, so publishing needs no
      # third-party action with write access to the repository.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            assets/*
